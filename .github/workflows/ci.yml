name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type- en contentcontrole
        run: npm run check
      - name: Contrastcontrole designtokens
        run: npm run check:contrast
      - name: Productiebuild
        run: npm run build
      - name: Controle noindex in previewbuild
        run: |
          grep -q 'name="robots" content="noindex, nofollow"' dist/index.html
          grep -q 'Disallow: /' dist/robots.txt
