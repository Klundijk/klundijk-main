# Sveltia CMS voor klundijk.com. Beheer op https://klundijk.com/admin
# Inloggen met een GitHub-token (fine-grained, alleen repo Klundijk/klundijk-main: Contents lezen/schrijven).
# Wijzigingen worden commits op main en komen automatisch op de testsite; live zetten via "Deploy live" in GitHub Actions.
backend:
  name: github
  repo: Klundijk/klundijk-main
  branch: main
  commit_messages:
    create: "Nieuw {{collection}}: {{slug}} (CMS)"
    update: "Bijgewerkt {{collection}}: {{slug}} (CMS)"
    delete: "Verwijderd {{collection}}: {{slug}} (CMS)"
    uploadMedia: "Beeld toegevoegd: {{path}} (CMS)"
    deleteMedia: "Beeld verwijderd: {{path}} (CMS)"
site_url: https://klundijk.com
display_url: https://klundijk.com
publish_mode: simple
logo:
  src: /favicon.svg
show_preview_links: true
media_folder: public/work
public_folder: /work
media_libraries:
  default:
    config:
      slugify_filename: true
      max_file_size: 15000000
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2000
collections:
  - name: cases
    label: Projecten
    label_singular: Project
    folder: src/content/cases
    extension: md
    format: frontmatter
    create: true
    delete: false
    slug: '{{slug}}'
    identifier_field: title
    summary: '{{order}} · {{title}}'
    sortable_fields: [order, title]
    media_folder: /public/work
    public_folder: /work
    fields:
      - label: "Naam van het project"
        name: "title"
        widget: "string"
      - label: "Soort"
        name: "kind"
        widget: "select"
        hint: "Case = volledige casepagina. Project = alleen een kaart op het werkoverzicht (\"Case volgt\")."
        options:
          - label: "Case (eigen pagina)"
            value: "case"
          - label: "Project (alleen kaart)"
            value: "project"
        default: "project"
      - label: "Volgorde op het werkoverzicht"
        name: "order"
        widget: "number"
        hint: "Laag getal staat bovenaan."
        value_type: "int"
        min: 1
        default: 99
      - label: "Labels op de kaart"
        name: "tags"
        widget: "list"
        hint: "Bijv. \"Merk & identiteit\", \"Website\", \"Webshop\"."
        required: false
        field:
          label: "Label"
          name: "item"
          widget: "string"
      - label: "Diensten"
        name: "services"
        widget: "select"
        hint: "Bepaalt onder welke dienst het project verschijnt."
        required: false
        multiple: true
        options:
          - label: "Webshops & commerce"
            value: "webshops-commerce"
          - label: "Websites"
            value: "websites-digitale-ervaringen"
          - label: "Groei & slimme processen"
            value: "groei-slimme-processen"
          - label: "Merk & identiteit"
            value: "merk-identiteit"
      - label: "Regel op de kaart"
        name: "excerpt"
        widget: "string"
        hint: "Eén regel."
        required: false
      - label: "Kaartkleur"
        name: "cardColor"
        widget: "color"
        hint: "Achtergrond van kaart en hero zolang er geen beeld is. Zorg voor voldoende contrast met de tekst."
        enableAlpha: false
        default: "#DAD5CB"
      - label: "Kaartbeeld"
        name: "cardImage"
        widget: "object"
        hint: "Beeld op de kaart. Upload bij voorkeur webp of jpg, max. 2000 px breed (wordt automatisch verkleind)."
        required: false
        fields:
          - label: "Beeld"
            name: "src"
            widget: "image"
            required: false
            choose_url: false
          - label: "Beschrijving (alt-tekst)"
            name: "alt"
            widget: "string"
            hint: "Beschrijf kort wat er te zien is, voor schermlezers."
            required: false
          - label: "Uitsnede (optioneel)"
            name: "position"
            widget: "string"
            hint: "CSS object-position, bijv. \"left top\" of \"30% 50%\"."
            required: false
      - label: "Binnenkort (project in uitvoering)"
        name: "soon"
        widget: "boolean"
        hint: "Aan = kaart toont \"Binnenkort\" met logo of merknaam in plaats van een beeld."
        required: false
        default: false
      - label: "Logo van de klant (bij \"Binnenkort\")"
        name: "logo"
        widget: "object"
        hint: "Liefst SVG of PNG met transparante achtergrond (wordt in de map werk geplaatst)."
        required: false
        fields:
          - label: "Beeld"
            name: "src"
            widget: "image"
            required: false
            choose_url: false
          - label: "Beschrijving (alt-tekst)"
            name: "alt"
            widget: "string"
            hint: "Beschrijf kort wat er te zien is, voor schermlezers."
            required: false
          - label: "Uitsnede (optioneel)"
            name: "position"
            widget: "string"
            hint: "CSS object-position, bijv. \"left top\" of \"30% 50%\"."
            required: false
      - label: "Uitgelicht"
        name: "featured"
        widget: "boolean"
        required: false
        default: false
      - label: "Concept (niet publiceren)"
        name: "draft"
        widget: "boolean"
        hint: "Aan = verborgen op de site."
        required: false
        default: false
      - label: "Placeholder (geen casepagina)"
        name: "placeholder"
        widget: "boolean"
        hint: "Aan = nog niet compleet; er wordt geen casepagina gemaakt."
        required: false
        default: false
      - label: "Belofte (casepagina)"
        name: "promise"
        widget: "string"
        hint: "Opgave of uitkomst in één regel. Verplicht voor een gepubliceerde case."
        required: false
      - label: "Klant"
        name: "client"
        widget: "string"
        required: false
      - label: "Sector"
        name: "sector"
        widget: "string"
        required: false
      - label: "Jaar"
        name: "year"
        widget: "number"
        required: false
        value_type: "int"
      - label: "Wat we deden (scope)"
        name: "scope"
        widget: "list"
        required: false
        field:
          label: "Onderdeel"
          name: "item"
          widget: "string"
      - label: "Technologie"
        name: "technology"
        widget: "list"
        required: false
        field:
          label: "Technologie"
          name: "item"
          widget: "string"
      - label: "Hero-beeld casepagina"
        name: "heroImage"
        widget: "object"
        required: false
        fields:
          - label: "Beeld"
            name: "src"
            widget: "image"
            required: false
            choose_url: false
          - label: "Beschrijving (alt-tekst)"
            name: "alt"
            widget: "string"
            hint: "Beschrijf kort wat er te zien is, voor schermlezers."
            required: false
          - label: "Uitsnede (optioneel)"
            name: "position"
            widget: "string"
            hint: "CSS object-position, bijv. \"left top\" of \"30% 50%\"."
            required: false
      - label: "Kop: vraagstuk"
        name: "challengeHeading"
        widget: "string"
        required: false
      - label: "Vraagstuk"
        name: "challenge"
        widget: "text"
        hint: "Verplicht voor een gepubliceerde case."
        required: false
      - label: "Kop: aanpak"
        name: "approachHeading"
        widget: "string"
        required: false
      - label: "Aanpak"
        name: "approach"
        widget: "text"
        hint: "Verplicht voor een gepubliceerde case."
        required: false
      - label: "Belangrijkste keuzes (max. 3)"
        name: "choices"
        widget: "list"
        required: false
        max: 3
        fields:
          - label: "Keuze"
            name: "title"
            widget: "string"
          - label: "Waarom"
            name: "reason"
            widget: "text"
      - label: "Detailbeelden (max. 2)"
        name: "detailImages"
        widget: "list"
        required: false
        max: 2
        fields:
          - label: "Beeld"
            name: "src"
            widget: "image"
            required: false
            choose_url: false
          - label: "Beschrijving (alt-tekst)"
            name: "alt"
            widget: "string"
            required: false
          - label: "Uitsnede (optioneel)"
            name: "position"
            widget: "string"
            required: false
      - label: "Kop: uitvoering"
        name: "executionHeading"
        widget: "string"
        required: false
        default: "Wat Klundijk deed."
      - label: "Beeld bij uitvoering"
        name: "executionImage"
        widget: "object"
        required: false
        fields:
          - label: "Beeld"
            name: "src"
            widget: "image"
            required: false
            choose_url: false
          - label: "Beschrijving (alt-tekst)"
            name: "alt"
            widget: "string"
            hint: "Beschrijf kort wat er te zien is, voor schermlezers."
            required: false
          - label: "Uitsnede (optioneel)"
            name: "position"
            widget: "string"
            hint: "CSS object-position, bijv. \"left top\" of \"30% 50%\"."
            required: false
      - label: "Kop: resultaat"
        name: "resultHeading"
        widget: "string"
        required: false
      - label: "Resultaat"
        name: "result"
        widget: "text"
        hint: "Verplicht voor een gepubliceerde case. Nooit cijfers verzinnen."
        required: false
      - label: "Cijfers (max. 3)"
        name: "metrics"
        widget: "list"
        hint: "Alleen aantoonbare cijfers."
        required: false
